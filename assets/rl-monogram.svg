<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Monograma RL">
  <defs>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="darkFace" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102b19"/>
      <stop offset="1" stop-color="#020604"/>
    </linearGradient>
  </defs>
  <rect width="900" height="700" fill="none"/>
  <g filter="url(#softGlow)">
    <text x="86" y="542"
      fill="url(#darkFace)"
      stroke="#f4fff4"
      stroke-width="20"
      paint-order="stroke fill"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="620"
      font-weight="700"
      letter-spacing="-84">RL</text>
    <text x="86" y="542"
      fill="none"
      stroke="#59f27e"
      stroke-width="9"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="620"
      font-weight="700"
      letter-spacing="-84">RL</text>
  </g>
</svg>
